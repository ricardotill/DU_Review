# DU Review in production: two app replicas behind a proxy, on an existing PostgreSQL server
# (not in this file). Fill in .env first (copy .env.example), then: docker compose pull && docker compose up -d
# See docs/handleiding-beheer.md, "Met Docker Compose".

services:
  app:
    # The image CI builds and pushes (see .github/workflows/ci.yml); APP_VERSION in .env pins a release.
    # `docker compose up -d --build` builds it from this repository instead.
    image: ghcr.io/ricardotill/du_review:${APP_VERSION:-latest}
    build: .
    restart: unless-stopped
    # Two instances on the same database: one talks to Slack, both serve pages (README, "Meerdere instanties")
    deploy:
      replicas: ${APP_REPLICAS:-2}
    # A PostgreSQL server on this machine is reachable as host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ConnectionStrings__scoutingdb: ${DATABASE_CONNECTION_STRING:?Set DATABASE_CONNECTION_STRING in .env}
      Scouting__Slack__BotToken: ${SLACK_BOT_TOKEN:?Set SLACK_BOT_TOKEN in .env}
      Scouting__Slack__AppToken: ${SLACK_APP_TOKEN:?Set SLACK_APP_TOKEN in .env}
      Scouting__Slack__SocketMode: "true"
      Scouting__Slack__SimulationMode: "false"
      # The first admin, made at the first start (see docs/handleiding-beheer.md, "Accounts")
      Scouting__Accounts__BootstrapAdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      # The address of the app from outside, for the links in mails, e.g. https://du.example.nl
      Scouting__PublicUrl: ${PUBLIC_URL:-}
      # Mail server for invitations and password resets; without SMTP_HOST mails only go to the log
      Scouting__Email__Host: ${SMTP_HOST:-}
      Scouting__Email__Port: ${SMTP_PORT:-587}
      Scouting__Email__Security: ${SMTP_SECURITY:-StartTls}
      Scouting__Email__Username: ${SMTP_USERNAME:-}
      Scouting__Email__Password: ${SMTP_PASSWORD:-}
      Scouting__Email__FromAddress: ${SMTP_FROM:-}
      # Trust X-Forwarded-For/-Proto from the proxy and cloudflared: the network below has only these containers
      ForwardedHeaders__KnownNetworks__0: 172.29.53.0/24
    networks:
      - web
    # The replicas share the files, so every replica sees every upload
    volumes:
      - app-data:/data
      # Edits to the points file count after `docker compose restart app`, without a rebuild
      - ./src/ScoutingAutomation.Web/opdrachtenpunten.csv:/app/opdrachtenpunten.csv:ro

  # The entrance: keeps each visitor on one replica (sticky sessions, see docker/Caddyfile)
  proxy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "${PORT:-5231}:8080"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
    networks:
      web:
        ipv4_address: 172.29.53.20

  # Optional HTTPS address via a Cloudflare Tunnel: set CLOUDFLARE_TUNNEL_TOKEN in .env, then
  # docker compose --profile tunnel up -d. In Cloudflare the public hostname points to http://proxy:8080.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - proxy
    networks:
      web:
        ipv4_address: 172.29.53.10

networks:
  # Own network: fixed addresses for cloudflared (.10) and the proxy (.20), replicas from the upper half
  web:
    ipam:
      config:
        - subnet: 172.29.53.0/24
          ip_range: 172.29.53.128/25

volumes:
  app-data:

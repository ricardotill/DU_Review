# Builds and tests every push and pull request. On main and on version tags it then pushes the Docker image
# (linux/amd64 and linux/arm64) to ghcr.io/ricardotill/du_review. See docs/handleiding-beheer.md, "Updates".
#
# Tags pushed:
#   main, sha-<short hash>      every push to main
#   1.4.0, 1.4, latest          a tag v1.4.0; the server follows `latest`, so only a release goes live
# Every action is pinned to a commit (tag in the comment); Dependabot proposes updates to the pins.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # The registry wants a lower-case name
  IMAGE: ghcr.io/ricardotill/du_review

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Some tests depend on the game's time zone
      TZ: Europe/Amsterdam
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/ScoutingAutomation.Web/package-lock.json

      - name: Restore
        run: dotnet restore ScoutingAutomation.slnx

      - name: Build
        run: dotnet build ScoutingAutomation.slnx --no-restore -c Release

      - name: Test
        run: >
          dotnet test ScoutingAutomation.slnx --no-build -c Release
          --logger "trx;LogFilePrefix=results" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  image:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history, to check that a release tag points at a commit on main
          fetch-depth: 0

      # The server deploys `latest` by itself: only a stable release (v1.4.0, no -rc) of a commit
      # that is on main may become `latest`. A tag elsewhere fails the job and pushes nothing.
      - name: App version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main"
              exit 1
            fi
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "stable=true" >> "$GITHUB_OUTPUT"
            else
              echo "stable=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "value=0.0.0-ci.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch,enable={{is_default_branch}}
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.title=DU Review

      # Only the few RUN steps of the final stage need emulation; the .NET build cross-compiles
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # A pull request only checks that the image builds
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
